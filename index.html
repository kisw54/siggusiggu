<!DOCTYPE html>
<html>
<head>
    <title>일랜시아 스타일 코지 게임</title>
    <style>
        body { text-align: center; background-color: #2c2c2c; margin-top: 50px; }
        canvas { background-color: #8FBC8F; border: 4px solid #555; image-rendering: pixelated; }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const playerImg = new Image();
        playerImg.src = "character.png"; // 같은 폴더의 character.png 로드

        let player = { x: 180, y: 180, size: 48, speed: 4 };
        let keys = {};

        window.addEventListener("keydown", (e) => keys[e.key] = true);
        window.addEventListener("keyup", (e) => keys[e.key] = false);

        function update() {
            if (keys["ArrowUp"] && player.y > 0) player.y -= player.speed;
            if (keys["ArrowDown"] && player.y < canvas.height - player.size) player.y += player.speed;
            if (keys["ArrowLeft"] && player.x > 0) player.x -= player.speed;
            if (keys["ArrowRight"] && player.x < canvas.width - player.size) player.x += player.speed;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(playerImg, player.x, player.y, player.size, player.size);
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        playerImg.onload = function() {
            gameLoop();
        };
    </script>
</body>
</html>
