<!DOCTYPE html>
<html>
<head>
    <title>일랜시아 스타일 코지 게임</title>
    <style>
        body { text-align: center; background-color: #2c2c2c; margin-top: 50px; }
        canvas { background-color: #8FBC8F; border: 4px solid #555; image-rendering: pixelated; }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // 1. 방향별 이미지 객체 생성 및 로드
        const images = {
            down: new Image(),
            up: new Image(),
            left: new Image(),
            right: new Image()
        };

        images.down.src = "down.png";
        images.up.src = "up.png";
        images.left.src = "left.png";
        images.right.src = "right.png";

        // 캐릭터 데이터 (direction: 현재 바라보는 방향 저장)
        let player = { 
            x: 180, 
            y: 180, 
            size: 48, 
            speed: 4,
            direction: "down" 
        };
        
        let keys = {};

        window.addEventListener("keydown", (e) => keys[e.key] = true);
        window.addEventListener("keyup", (e) => keys[e.key] = false);

        function update() {
            // 키 입력에 따라 위치 이동 및 바라보는 방향(direction) 업데이트
            if (keys["ArrowUp"]) {
                if (player.y > 0) player.y -= player.speed;
                player.direction = "up";
            } else if (keys["ArrowDown"]) {
                if (player.y < canvas.height - player.size) player.y += player.speed;
                player.direction = "down";
            } else if (keys["ArrowLeft"]) {
                if (player.x > 0) player.x -= player.speed;
                player.direction = "left";
            } else if (keys["ArrowRight"]) {
                if (player.x < canvas.width - player.size) player.x += player.speed;
                player.direction = "right";
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 2. 현재 direction에 맞는 이미지를 선택하여 그리기
            const currentImg = images[player.direction];
            ctx.drawImage(currentImg, player.x, player.y, player.size, player.size);
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        // 정면 이미지가 로딩 완료되면 루프 실행
        images.down.onload = function() {
            gameLoop();
        };
    </script>
</body>
</html>
